name: Build TeluguTV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Create Android project files
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.telugutv --project-name telugutv_news
            rm -rf test
          fi

      - name: Set app name, internet permission, min SDK
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="TeluguTV"#' $M
          for G in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f $G ] && sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' $G
          done
          head -20 $M

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: TeluguTV-apk
          path: build/app/outputs/flutter-apk/app-release.apk
